name: CI / CD & Multi-Platform Build Matrix

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install System Dependencies (Linux Mesa / OpenGL)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libegl1-mesa libxrandr2 libxss1 libxcursor1 libxcomposite1 libasound2t64 libxi6 libxtst6

      - name: Install Python Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .
          pip install pytest pytest-cov pytest-qt meshio matplotlib

      - name: Install Python Dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .
          pip install pytest pytest-qt meshio matplotlib

      - name: Run Test Suite & Coverage Gate (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        run: |
          pytest --cov=src/orang3d --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=90 tests/ -v

      - name: Run Test Suite (Windows)
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        run: |
          pytest tests/ -v

      - name: Upload Test Coverage Artifacts
        uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  package:
    name: Build Standalone Executables (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libegl1-mesa

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip build pyinstaller pillow
          pip install -e .

      - name: Build Standard Wheels & Source Tarball
        run: |
          python -m build

      - name: Build Standalone Portable Executable & Archive
        run: |
          python scripts/build_executable.py --clean --archive

      - name: Upload Linux Standalone Distribution (.tar.gz)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: orang3d-linux-x86_64
          path: dist/*.tar.gz
          retention-days: 30

      - name: Upload Windows Standalone Distribution (.zip)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: orang3d-windows-x64
          path: dist/*.zip
          retention-days: 30
